name: Build AnixArtix Tauri
on:
  push:
    branches: [main]
    paths: ["src/**", "src-tauri/**", "public/**", "icon/**", "test/**", "server/**", "package*.json", "*.config.*", "scripts/**", "installer/**", "LICENSE", "FORK-NOTICE.md", ".github/workflows/build-client.yml"]
  pull_request:
    paths: ["src/**", "src-tauri/**", "public/**", "icon/**", "test/**", "server/**", "package*.json", "*.config.*", "scripts/**", "installer/**", "LICENSE", "FORK-NOTICE.md", ".github/workflows/build-client.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anixartix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows x64 Tauri
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test animated setup shell (harmless fixture)
        shell: powershell
        run: ./installer/test.ps1
      - name: Upload installer visual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: AnixArtix-Installer-Preview
          path: dist/installer-preview/*
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt
          targets: x86_64-pc-windows-msvc
      - run: npm ci --legacy-peer-deps
      - run: npm ci --prefix server
      - run: npm test --prefix server
      - run: npm test
      - name: Rust core tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --lib --locked
      - name: Build Windows installer
        run: npm run make:windows
      - name: Capture actual native startup window (no login)
        shell: powershell
        timeout-minutes: 2
        run: ./installer/native-preview.ps1
      - name: Upload native startup visual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: AnixArtix-Native-Preview
          path: dist/native-preview/*
          if-no-files-found: warn
          retention-days: 14
      - name: Package animated setup
        shell: powershell
        run: ./installer/build.ps1
      - name: Package corresponding GPL source
        shell: powershell
        run: |
          git archive --format=zip --prefix=AnixArtix-source/ --output=dist/installer/AnixArtix-source.zip ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          $hash = (Get-FileHash dist/installer/AnixArtix-source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$pwd/dist/installer/AnixArtix-source.zip.sha256", "$hash  AnixArtix-source.zip`n")
      - uses: actions/upload-artifact@v7
        with:
          name: AnixArtix-Windows-x64-Tauri
          path: dist/installer/*
          if-no-files-found: error
          retention-days: 14
