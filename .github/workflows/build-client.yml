name: Build AnixArtix Tauri
on:
  push:
    branches: [main, "work/**"]
    paths: ["src/**", "src-tauri/**", "public/**", "icon/**", "test/**", "server/**", "package*.json", "*.config.*", "scripts/**", ".github/workflows/build-client.yml"]
  pull_request:
    paths: ["src/**", "src-tauri/**", "public/**", "icon/**", "test/**", "server/**", "package*.json", "*.config.*", "scripts/**", ".github/workflows/build-client.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anixartix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows x64 Tauri
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt
          targets: x86_64-pc-windows-msvc
      - run: npm ci --legacy-peer-deps
      - run: npm ci --prefix server
      - run: npm test --prefix server
      - run: npm test
      - name: Rust core tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --lib --locked
      - name: Build Windows installer
        run: npm run make:windows
      - uses: actions/upload-artifact@v7
        with:
          name: AnixArtix-Windows-x64-Tauri
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
